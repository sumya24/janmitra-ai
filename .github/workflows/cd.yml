name: CD

# Runs only after CI has finished successfully on main -- never deploys code that hasn't
# passed the test suite. See ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend-react/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # See docs/DEPLOYMENT.md for what one-time setup this expects on the server: the repo
      # cloned to SSH_DEPLOY_PATH, Docker + the Compose plugin installed, and a .env file with
      # the app's runtime secrets (SARVAM_API_KEY, JWT_SECRET_KEY, etc.) already in place.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Persist the image tags to deploy in .env so a plain `docker compose up -d` on the
            # server (e.g. after a manual reboot) reuses the last-deployed images.
            grep -vE '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env > .env.tmp || true
            mv .env.tmp .env
            echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" >> .env
            echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> .env

            # Prune BEFORE pulling too, not just after: `docker image prune -f` (no -a) only ever
            # removed dangling (untagged) layers, never the previous deploy's still-tagged image
            # -- those accumulated deploy over deploy until the VM's disk filled up and pull
            # itself started failing with "no space left on device", which then skipped the
            # prune-after-deploy step entirely (this script exits on error), making the next
            # deploy fail the same way. `-a` removes any image not used by a running container,
            # so this is safe to run right before `pull` swaps in the new one.
            docker image prune -af

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af
