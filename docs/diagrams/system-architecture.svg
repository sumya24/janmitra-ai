<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">JanMitra AI — System Architecture</text>
  <text x="470" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">Three tiers: a browser front end, one backend that owns every rule, and where each thing is stored</text>

  <!-- ============ TIER LABELS ============ -->
  <text x="120" y="90" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">FRONT END</text>
  <text x="430" y="90" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">BACKEND</text>
  <text x="740" y="90" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1">STORAGE &amp; EXTERNAL SERVICES</text>

  <!-- ============ BROWSER BOX ============ -->
  <rect x="30" y="105" width="200" height="200" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="132" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">Browser</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#4c1d95">React + TypeScript SPA</text>
  <line x1="46" y1="162" x2="214" y2="162" stroke="#c7d2fe" stroke-width="1"/>
  <text x="46" y="182" font-size="11" fill="#3730a3">• 3 dashboards: Citizen,</text>
  <text x="58" y="196" font-size="11" fill="#3730a3">Worker, Super Admin</text>
  <text x="46" y="216" font-size="11" fill="#3730a3">• JWT kept client-side,</text>
  <text x="58" y="230" font-size="11" fill="#3730a3">sent on every request</text>
  <text x="46" y="250" font-size="11" fill="#3730a3">• MediaRecorder: records</text>
  <text x="58" y="264" font-size="11" fill="#3730a3">voice in ≤28s segments</text>
  <text x="46" y="284" font-size="11" fill="#3730a3">• 6 UI languages</text>

  <!-- Arrow: Browser -> Backend -->
  <path d="M 230 205 L 388 205" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="309" y="188" text-anchor="middle" font-size="10.5" fill="#374151" font-weight="600">HTTPS + JWT</text>
  <text x="309" y="221" text-anchor="middle" font-size="9.5" fill="#9ca3af">(Bearer token)</text>

  <!-- Arrow: Backend -> Browser (response) -->
  <path d="M 388 225 L 230 225" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)" stroke-dasharray="3,3"/>
  <text x="309" y="242" text-anchor="middle" font-size="9.5" fill="#9ca3af">JSON response</text>

  <!-- ============ BACKEND BOX ============ -->
  <rect x="390" y="105" width="220" height="330" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="132" text-anchor="middle" font-size="14.5" font-weight="700" fill="#064e3b">FastAPI Backend</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#065f46">Python — the only piece that</text>
  <text x="500" y="163" text-anchor="middle" font-size="11" fill="#065f46">touches the database or Sarvam</text>
  <line x1="406" y1="176" x2="594" y2="176" stroke="#a7f3d0" stroke-width="1"/>

  <rect x="406" y="188" width="188" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="209" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">deps.py — verify JWT, check role</text>

  <rect x="406" y="230" width="188" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="251" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">routes/ — auth · complaints · admin</text>

  <rect x="406" y="272" width="188" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="291" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">ComplaintAgent</text>
  <text x="500" y="306" text-anchor="middle" font-size="9.5" fill="#065f46">orchestrates the AI pipeline</text>
  <text x="500" y="318" text-anchor="middle" font-size="9.5" fill="#065f46">(see AI_AGENT.md)</text>

  <rect x="406" y="332" width="188" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="353" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">assignment_service.py — ward routing</text>

  <rect x="406" y="374" width="188" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="393" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">translation_cache</text>
  <text x="500" y="407" text-anchor="middle" font-size="9.5" fill="#065f46">1 Sarvam call per (complaint, lang)</text>

  <!-- ============ RIGHT COLUMN: storage/external ============ -->
  <!-- SQLite -->
  <rect x="660" y="105" width="250" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="785" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">SQLite Database</text>
  <text x="785" y="149" text-anchor="middle" font-size="10.5" fill="#92400e">users · complaints ·</text>
  <text x="785" y="163" text-anchor="middle" font-size="10.5" fill="#92400e">complaint_rejections ·</text>
  <text x="785" y="177" text-anchor="middle" font-size="10.5" fill="#92400e">complaint_translations</text>

  <!-- Sarvam AI (external, dashed) -->
  <rect x="660" y="215" width="250" height="130" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="785" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#831843">Sarvam AI</text>
  <text x="785" y="253" text-anchor="middle" font-size="10" fill="#9d174d">external vendor — the only</text>
  <text x="785" y="266" text-anchor="middle" font-size="10" fill="#9d174d">thing outside this codebase</text>
  <line x1="676" y1="277" x2="894" y2="277" stroke="#f9a8d4" stroke-width="1"/>
  <text x="785" y="296" text-anchor="middle" font-size="10.5" fill="#831843">saaras:v3 — speech-to-text</text>
  <text x="785" y="313" text-anchor="middle" font-size="10.5" fill="#831843">sarvam-translate:v1 — translate</text>
  <text x="785" y="330" text-anchor="middle" font-size="10.5" fill="#831843">sarvam-105b — normalize + summary</text>

  <!-- uploads folder -->
  <rect x="660" y="360" width="250" height="75" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="785" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0c4a6e">uploads/ folder</text>
  <text x="785" y="404" text-anchor="middle" font-size="10.5" fill="#075985">local disk — complaint photos,</text>
  <text x="785" y="418" text-anchor="middle" font-size="10.5" fill="#075985">served at /uploads/*</text>

  <!-- Arrows: backend -> right column -->
  <path d="M 610 150 L 656 150" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 610 280 L 656 280" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 610 397 L 656 397" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend / footnote -->
  <rect x="30" y="460" width="880" height="80" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="48" y="482" font-size="11.5" font-weight="700" fill="#374151">Why it's shaped this way</text>
  <text x="48" y="500" font-size="10.5" fill="#4b5563">The browser never talks to the database, the file system, or Sarvam directly — every decision (who's allowed to do what, what</text>
  <text x="48" y="515" font-size="10.5" fill="#4b5563">gets stored, when to call an AI vendor) is made in one place: the FastAPI backend. That's a classic three-tier design, and it's why</text>
  <text x="48" y="530" font-size="10.5" fill="#4b5563">a citizen's browser only ever needs a JWT, never an API key.</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowgray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
