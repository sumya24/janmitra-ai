<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>

  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">How ComplaintAgent turns speech (or text) into a stored complaint</text>
  <text x="490" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">Every box here is a real, measured step — see the numbers pulled from live tests against the actual Sarvam API</text>

  <!-- STAGE 1: recording split -->
  <rect x="30" y="75" width="920" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="50" y="98" font-size="12" font-weight="700" fill="#713f12">1 · CLIENT-SIDE (browser) — only for voice input</text>

  <rect x="50" y="110" width="160" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="130" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">Citizen speaks</text>
  <text x="130" y="150" text-anchor="middle" font-size="10" fill="#854d0e">(could be 90s+)</text>

  <path d="M 210 140 L 250 140" stroke="#713f12" stroke-width="1.5" fill="none" marker-end="url(#arrowY)"/>

  <rect x="252" y="110" width="330" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="417" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">Recorder stops &amp; restarts itself every 28s</text>
  <text x="417" y="145" text-anchor="middle" font-size="10" fill="#854d0e">useAudioRecorder.ts — each restart = one clean,</text>
  <text x="417" y="158" text-anchor="middle" font-size="10" fill="#854d0e">independently-valid audio file (a "chunk")</text>

  <path d="M 585 140 L 620 140" stroke="#713f12" stroke-width="1.5" fill="none" marker-end="url(#arrowY)"/>

  <rect x="622" y="105" width="290" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="767" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">Why chunk at all?</text>
  <text x="767" y="140" text-anchor="middle" font-size="10" fill="#991b1b">Sarvam's STT hard-rejects &gt;30s</text>
  <text x="767" y="153" text-anchor="middle" font-size="10" fill="#991b1b">per request — confirmed live:</text>
  <text x="767" y="166" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#7f1d1d">"exceeds max limit of 30 seconds"</text>

  <!-- STAGE 2: per-chunk STT -->
  <path d="M 490 185 L 490 210" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

  <rect x="30" y="212" width="920" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="235" font-size="12" font-weight="700" fill="#1e3a8a">2 · BACKEND — ComplaintAgent._transcribe_chunks(), once per chunk, in order</text>

  <rect x="55" y="248" width="180" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="145" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">STT attempt 1</text>
  <text x="145" y="285" text-anchor="middle" font-size="9.5" fill="#1e40af">(saaras:v3)</text>

  <path d="M 235 275 L 262 275" stroke="#1e3a8a" stroke-width="1.5" fill="none" marker-end="url(#arrowBl)"/>
  <text x="248" y="266" text-anchor="middle" font-size="9" fill="#1e3a8a">fails</text>

  <rect x="264" y="248" width="180" height="55" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="354" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Retry once</text>
  <text x="354" y="285" text-anchor="middle" font-size="9.5" fill="#9a3412">(attempt 2/2)</text>

  <path d="M 145 303 L 145 330" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="175" y="320" font-size="9" fill="#166534">succeeds</text>
  <path d="M 354 303 L 354 330" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowG)"/>
  <path d="M 354 303 L 354 330" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrowR)" transform="translate(140,0)"/>

  <rect x="80" y="332" width="200" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="180" y="352" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">Use this chunk's real</text>
  <text x="180" y="366" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">transcribed text</text>

  <rect x="440" y="332" width="240" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="560" y="352" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7f1d1d">Both attempts failed →</text>
  <text x="560" y="366" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7f1d1d">insert an honest gap marker</text>

  <rect x="700" y="240" width="235" height="115" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="817" y="258" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Measured live (not guessed)</text>
  <text x="817" y="276" text-anchor="middle" font-size="9.5" fill="#4b5563">2 real chunks (28.0s + 25.7s):</text>
  <text x="817" y="290" text-anchor="middle" font-size="9.5" fill="#4b5563">both succeeded 1st try, 5.4s total</text>
  <text x="817" y="308" text-anchor="middle" font-size="9.5" fill="#4b5563">Only ~1% of complaints are</text>
  <text x="817" y="322" text-anchor="middle" font-size="9.5" fill="#4b5563">expected to need this retry path —</text>
  <text x="817" y="336" text-anchor="middle" font-size="9.5" fill="#4b5563">it exists for the rare real failure,</text>
  <text x="817" y="350" text-anchor="middle" font-size="9.5" fill="#4b5563">not the common case</text>

  <!-- join -->
  <path d="M 180 378 L 180 400 L 490 400" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M 560 378 L 560 400 L 490 400" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <text x="490" y="393" text-anchor="middle" font-size="10" fill="#374151">repeat for every chunk, then join in order →</text>

  <!-- STAGE 3: normalize/translate/summarize -->
  <path d="M 490 400 L 490 415" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

  <rect x="30" y="418" width="920" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="440" font-size="12" font-weight="700" fill="#14532d">3 · BACKEND — same pipeline whether input was voice (joined transcript) or typed text</text>

  <rect x="55" y="455" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="155" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Normalize</text>
  <text x="155" y="491" text-anchor="middle" font-size="9.5" fill="#166534">fix typos, citizen's own</text>
  <text x="155" y="503" text-anchor="middle" font-size="9.5" fill="#166534">language, sarvam-105b</text>

  <path d="M 258 490 L 285 490" stroke="#14532d" stroke-width="1.5" fill="none" marker-end="url(#arrowGr)"/>

  <rect x="287" y="455" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="387" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Translate</text>
  <text x="387" y="491" text-anchor="middle" font-size="9.5" fill="#166534">→ English, the one</text>
  <text x="387" y="503" text-anchor="middle" font-size="9.5" fill="#166534">canonical stored language</text>

  <path d="M 490 490 L 517 490" stroke="#14532d" stroke-width="1.5" fill="none" marker-end="url(#arrowGr)"/>

  <rect x="519" y="455" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="619" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Summarize</text>
  <text x="619" y="491" text-anchor="middle" font-size="9.5" fill="#166534">short 1-2 sentence gist,</text>
  <text x="619" y="503" text-anchor="middle" font-size="9.5" fill="#166534">best-effort (see below)</text>

  <path d="M 722 490 L 749 490" stroke="#14532d" stroke-width="1.5" fill="none" marker-end="url(#arrowGr)"/>

  <rect x="751" y="455" width="180" height="70" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="841" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#052e16">Complaint stored</text>
  <text x="841" y="497" text-anchor="middle" font-size="9.5" fill="#14532d">English text + summary,</text>
  <text x="841" y="510" text-anchor="middle" font-size="9.5" fill="#14532d">ready for assignment</text>

  <!-- Best-effort note -->
  <rect x="30" y="565" width="920" height="130" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="50" y="588" font-size="12" font-weight="700" fill="#701a75">Why every AI step here is "best-effort," never submission-blocking</text>
  <text x="50" y="608" font-size="10.5" fill="#581c87">Real testing found no clean word-count limit for normalize/summarize — reliability depends on the model's unpredictable internal</text>
  <text x="50" y="624" font-size="10.5" fill="#581c87">"reasoning" time per call, not input size. At 500 words, normalize failed 75% of the time in repeated live trials; a 300-word complaint</text>
  <text x="50" y="640" font-size="10.5" fill="#581c87">was reliable. So instead of chasing a magic token/timeout number: normalize silently falls back to the un-normalized text on failure,</text>
  <text x="50" y="656" font-size="10.5" fill="#581c87">and summarize falls back to a truncated excerpt of the translated text — a citizen's complaint is never lost over an AI step failing.</text>
  <text x="50" y="678" font-size="10.5" font-weight="600" fill="#701a75">Full measured numbers: see "Real, measured limits" further down this document.</text>

  <defs>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#713f12"/></marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="arrowBl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,7 Z" fill="#1e3a8a"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,7 Z" fill="#16a34a"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,7 Z" fill="#dc2626"/></marker>
    <marker id="arrowGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,7 Z" fill="#14532d"/></marker>
  </defs>
</svg>
