<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2: Chrome caches tab favicons very aggressively per-origin, independent of normal
         HTTP caching -- a tab open from before this file existed can keep showing a stale (or
         browser-default) icon indefinitely. A version query string makes it a new request the
         browser hasn't cached, forcing a refresh even in already-open tabs on reload. Bump the
         version again if the icon is ever replaced and a stale tab problem resurfaces. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0F2D6B" />
    <meta name="description" content="JanSarthi AI — municipal grievance redressal in your own language, powered by AI." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanSarthi AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
